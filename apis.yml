aid: utility-global
name: Utility Global
description: 'Utility Global is a Houston, Texas industrial decarbonization company founded
  in 2018. Its proprietary H2Gen and eXERO platform converts water into high-purity hydrogen
  using the residual electrochemical energy already present in industrial off-gases and biogenic
  gases — driving water electrolysis without electricity — while concentrating CO2 into a
  separate capture-ready stream. The company sells into steel, low-carbon fuels, and refining,
  petrochemicals and chemicals, and has run demonstration programs on blast-furnace off-gas at
  commercial steel facilities. It is a hardware and process-technology business, not a software
  vendor: its public web presence is a marketing site with no developer program, no API
  documentation, and no machine-readable contract of any kind.'
